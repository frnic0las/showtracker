<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShowTracker — Offline</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
    background: #FFFFFF;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    font-size: 15px;
    color: #6B6B70;
    margin: 0;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background: #000000;
      color: #FFFFFF;
    }
    p {
      color: #A0A0A5;
    }
  }
</style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
  </div>
</body>
</html>
